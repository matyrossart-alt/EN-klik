body{margin:0}
/* Layout: klidný tyrkysový podklad, uprostřed světlý list; téma = teorie nahoře, pod ní filtry částí a karta s úlohou */
:root{
  --bg:#d8eeeb; --sheet:#fbfefd; --card:#edf7f5; --box:#e3f3f0; --line:#c3dfda;
  --ink:#1c3130; --muted:#5a7573; --phon:#6a8381; --accent:#1f7672; --accent-ink:#ffffff; --accent-soft:#d3ece8;
  --ok:#2c7a4c; --ok-bg:#e3f3e8; --bad:#a94337; --bad-bg:#f8e9e6;
  --head:"Lexend","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1d1c; --sheet:#132726; --card:#18302f; --box:#1b3534; --line:#2b4846;
  --ink:#e2f1ef; --muted:#9db9b6; --phon:#8fabA8; --accent:#5ec6be; --accent-ink:#0e1d1c; --accent-soft:#1f3f3d;
  --ok:#76d29d; --ok-bg:#183a29; --bad:#f2998d; --bad-bg:#3f2421; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1d1c; --sheet:#132726; --card:#18302f; --box:#1b3534; --line:#2b4846;
  --ink:#e2f1ef; --muted:#9db9b6; --phon:#8faba8; --accent:#5ec6be; --accent-ink:#0e1d1c; --accent-soft:#1f3f3d;
  --ok:#76d29d; --ok-bg:#183a29; --bad:#f2998d; --bad-bg:#3f2421; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.sheet{max-width:880px;margin:0 auto;background:var(--sheet);border-radius:22px;padding:28px clamp(16px,4vw,48px) 40px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.2;text-wrap:balance}
.ph{color:var(--phon);font-weight:400}
b .ph,.ph b{font-weight:400}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{background:none;border:0;padding:0;font-family:var(--head);font-weight:700;font-size:1.25rem;color:var(--accent)}
.back{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.92rem}
.back:hover{border-color:var(--accent);color:var(--accent)}

.intro h1{font-size:clamp(1.7rem,4.6vw,2.3rem);font-weight:700}
.intro p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.legend{background:var(--box);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:.95rem}
.legend b{color:var(--accent)}
.label{font-family:var(--head);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* deska témat */
.topics{display:flex;flex-direction:column;gap:12px}
.topic{border:1.5px solid var(--line);border-radius:16px;background:var(--sheet);overflow:hidden}
.topic.open{border-color:var(--accent)}
.t-head{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:none;border:0;padding:16px 18px;text-align:left}
.t-num{font-family:var(--head);font-weight:700;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.t-head h2{font-size:1.2rem;font-weight:600}
.t-head small{display:block;color:var(--muted);font-size:.88rem}
.bar{height:6px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.chev{color:var(--muted);font-size:1.3rem;transition:transform .2s}
.topic.open .chev{transform:rotate(90deg);color:var(--accent)}
.t-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.t-body p{margin:0}
.subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sub{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:12px 14px}
.sub:hover{border-color:var(--accent)}
.sub span{font-size:.85rem;color:var(--muted)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:13px 20px;font-weight:700}
.primary:hover{filter:brightness(1.07)}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{border:1.5px dashed var(--line);border-radius:999px;padding:6px 12px;font-size:.9rem;color:var(--muted)}

/* stránka tématu */
.t-title h1{font-size:clamp(1.6rem,4.4vw,2.1rem)}
.summary{background:var(--box);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.summary p{margin:0}
details.theory{border:1px solid var(--line);border-radius:16px;background:var(--sheet)}
details.theory summary{cursor:pointer;padding:16px 20px;font-family:var(--head);font-weight:600;color:var(--accent);list-style:none}
details.theory summary::-webkit-details-marker{display:none}
details.theory summary::before{content:"▶";display:inline-block;margin-right:10px;font-size:.8em;transition:transform .2s}
details.theory[open] summary::before{transform:rotate(90deg)}
.th-body{padding:0 20px 18px;display:flex;flex-direction:column;gap:16px}
.th-body h3{font-size:1.02rem;font-weight:600;margin-bottom:4px}
.th-body ul{margin:6px 0 0;padding-left:1.2em}
.th-body li{margin:3px 0}
.tbl{overflow-x:auto;margin-bottom:8px}
.tbl table{border-collapse:collapse;font-size:.95rem;min-width:420px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.tbl th{background:var(--box);font-weight:700;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:11px 18px;font-weight:700}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status{display:flex;justify-content:space-between;gap:12px;font-family:var(--head);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:-10px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px clamp(16px,3.4vw,34px);display:flex;flex-direction:column;gap:14px}
.kind{font-family:var(--head);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.prompt{font-family:var(--head);font-size:clamp(1.45rem,4.2vw,2.05rem);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.prompt .ph{font-weight:500}
.note{color:var(--muted);font-size:.98rem}
.note b{color:var(--ink)}
.ask{color:var(--muted);font-weight:700}
.tr-btn{align-self:flex-start;border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:9px 16px;font-weight:700;font-size:.95rem}
.tr-btn:hover{border-color:var(--accent)}
.tr{color:var(--accent);font-weight:700;margin-top:-4px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;font-size:1.05rem}
.opt b{font-weight:700}
.opt kbd{font-family:var(--body);font-size:.75rem;font-weight:700;flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--card);color:var(--muted)}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt:not([disabled]):hover{border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok b{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad b{color:var(--bad)}
.opt.dim{opacity:.6}
.fb{display:flex;flex-direction:column;gap:4px}
.fb strong{font-family:var(--head);font-size:1.08rem}
.fb.ok strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.fb p{margin:0}
.ex{margin-top:6px!important;padding:10px 14px;border-radius:12px;background:var(--box);border:1px solid var(--line)}
.ex-l{font-weight:700;color:var(--accent)}
.ex-cz{color:var(--muted)}
.close-th{align-self:flex-start}
.cz{color:var(--muted);font-style:normal;font-weight:400}
.say{border:1.5px solid var(--line);background:var(--sheet);color:var(--accent);border-radius:999px;width:34px;height:34px;padding:0;display:inline-grid;place-items:center;vertical-align:middle;margin-left:8px}
.say:hover{border-color:var(--accent)}
.prompt .say{width:38px;height:38px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:9px 18px;font-weight:700}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.modebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.typer{display:flex;flex-direction:column;gap:12px}
.type-in{width:100%;font:inherit;font-size:1.15rem;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--sheet);color:var(--ink)}
.type-in:focus{outline:3px solid var(--accent);outline-offset:1px}
.type-in.ok{border-color:var(--ok);background:var(--ok-bg)}
.type-in.bad{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.badge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--bad-bg);color:var(--bad);font-size:.75rem;letter-spacing:.04em}
.rev{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--box);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.rev h2{font-size:1.1rem}
.rev p{margin:4px 0 0;max-width:52ch}
.top-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inst-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.92rem}
.inst-btn:hover{filter:brightness(1.07)}
.install{background:var(--box);border:1.5px solid var(--accent);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.inst-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.inst-head h2{font-size:1.1rem}
.install ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.install p{margin:0}
.say-box{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:2px solid var(--accent);box-shadow:0 -6px 20px rgba(0,0,0,.15);
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:10px}
.say-box p{margin:0;max-width:60ch}
a.primary{text-decoration:none;display:inline-block}
.why{margin-top:6px!important;padding:10px 14px;border-radius:12px;background:var(--sheet);border:1px solid var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.ghost{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px 20px;font-weight:700}
.ghost:hover{border-color:var(--accent)}
.hint{font-size:.85rem;color:var(--muted)}
.score{font-family:var(--head);font-size:clamp(2.8rem,10vw,4rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.score small{font-size:.4em;color:var(--muted)}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.miss li{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.miss .y{color:var(--bad);text-decoration:line-through;font-size:.92rem}
.miss .c{color:var(--ok);font-weight:700}

@media (max-width:560px){ .subs{grid-template-columns:1fr} .sheet{border-radius:16px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

["Otázky: pomocník jde dopředu", "Anglická otázka má stálé pořadí: <b>pomocník + kdo + sloveso</b>.<ul><li>Přítomnost: <b>Do</b> you like…? <span class='cz'>(Máš rád…?)</span> <b>Does</b> she like…? <span class='cz'>(Má ráda…?)</span></li><li>Minulost: <b>Did</b> you see…? <span class='cz'>(Viděl jsi…?)</span></li><li>Sloveso <i>be</i> a <i>can</i> pomocníka nepotřebují, jen se přesunou dopředu: <b>Are</b> you…? <span class='cz'>(Jsi…?)</span> <b>Can</b> you…? <span class='cz'>(Můžeš…?)</span></li></ul>Po <i>does</i> a <i>did</i> je sloveso vždy v základním tvaru: Does she <b>like</b>? <span class='cz'>(Má ráda?)</span> Did you <b>see</b>? <span class='cz'>(Viděl jsi?)</span>"],
["Zápory: jen jeden zápor", "Zápor tvoříme pomocí <b>don't / doesn't / didn't</b> + základní tvar: <i>I don't like</i> <span class='cz'>(nemám rád)</span>, <i>she doesn't like</i> <span class='cz'>(nemá ráda)</span>, <i>I didn't see</i> <span class='cz'>(neviděl jsem)</span>.<br>Sloveso <i>be</i> a <i>can</i> se zapírají samy: <i>I'm not</i> <span class='cz'>(nejsem)</span>, <i>he isn't</i> <span class='cz'>(není)</span>, <i>I can't</i> <span class='cz'>(nemůžu)</span>.<br>Čeština má dvojí zápor (Nikdo <b>ne</b>přišel). Angličtina má ve větě <b>jen jeden</b>: <i>Nobody came.</i> <span class='cz'>(Nikdo nepřišel.)</span>"],
["Být, moct, smět: zvláštní slovesa", "Sloveso <b>be</b> (být) je nepravidelné, a to nejvíc ze všech: <i>I <b>am</b></i> <span class='cz'>(jsem)</span>, <i>he / she / it <b>is</b></i> <span class='cz'>(on, ona, ono je)</span>, <i>we / you / they <b>are</b></i> <span class='cz'>(jsme, jsi / jste, jsou)</span>. V minulosti: <i>I / he / she / it <b>was</b></i> <span class='cz'>(byl jsem, byl, byla, bylo)</span>, <i>we / you / they <b>were</b></i> <span class='cz'>(byli jsme, byl jsi / byli jste, byli)</span>.<br><b>Can</b> (můžu, umím) a <b>may</b> (smím) nejsou „nepravidelná slovesa“ v běžném smyslu. Patří do zvláštní skupiny <b>způsobových sloves</b> a mají společná jednoduchá pravidla:<ul><li>nikdy nemají -s: he <b>can</b> <span class='cz'>(on může)</span>, ne „cans“,</li><li>nepotřebují do: <b>Can</b> you…? <span class='cz'>(Můžeš…?)</span> I <b>can't</b>… <span class='cz'>(Nemůžu…)</span></li><li>po nich je sloveso bez to: I can <b>swim</b> <span class='cz'>(umím plavat)</span>.</li></ul>Minulost od can je <b>could</b> (mohl jsem, uměl jsem). <i>Could you…?</i> <span class='cz'>(Mohl byste…?)</span> je také zdvořilá prosba."],
["Běžné věty: pořadí slov a minulost", "Anglická věta má pevné pořadí: <b>kdo – co dělá – co / koho – kde – kdy</b>.<br><i>She bought good coffee in the shop yesterday.</i> <span class='cz'>(Včera koupila v obchodě dobrou kávu.)</span><ul><li>Minulost pravidelných sloves: <b>-ed</b>: work → worked <span class='cz'>(pracovat → pracoval)</span>, cook → cooked <span class='cz'>(vařit → vařil)</span>.</li><li>Nepravidelná slovesa mají vlastní tvar, který se učí zpaměti: buy → <b>bought</b> <span class='cz'>(koupit)</span>, go → <b>went</b> <span class='cz'>(jít)</span>, see → <b>saw</b> <span class='cz'>(vidět)</span>, eat → <b>ate</b> <span class='cz'>(jíst)</span>, write → <b>wrote</b> <span class='cz'>(psát)</span>.</li><li>Slova <i>often</i> <span class='cz'>(často)</span>, <i>usually</i> <span class='cz'>(obvykle)</span>, <i>never</i> <span class='cz'>(nikdy)</span>, <i>only</i> <span class='cz'>(jen)</span> stojí před slovesem: She <b>often goes</b> to Moravia. <span class='cz'>(Často jezdí na Moravu.)</span></li><li>Zvyk (pořád, každou sobotu) = přítomný čas: She <b>reads</b> on Saturdays. <span class='cz'>(Čte v sobotu.)</span></li></ul>"],
["Jak si to zapamatovat", "Pomocník <b>does</b> si „vezme“ koncovku -s. Proto: <i>She likes</i> <span class='cz'>(Má ráda)</span> → <i>Does she like?</i> <span class='cz'>(Má ráda?)</span> → <i>She doesn't like.</i> <span class='cz'>(Nemá ráda.)</span><br>Stejně <b>did</b> si vezme minulost: <i>She went</i> <span class='cz'>(Šla)</span> → <i>Did she go?</i> <span class='cz'>(Šla?)</span>"]
],

["Slovíčka", `

function pickVoice(){ try { const v = speechSynthesis.getVoices(); voice = v.find(x => /en[-_]GB/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; } catch(e) {} }
if (canSay) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch(e) {} }
function sayFallback(t){
  const url = "https://translate.google.com/?sl=en&tl=cs&op=translate&text=" + encodeURIComponent(t.replace(/_{3}/g, "…"));
  let box = document.getElementById("say-box");
  if (!box) { box = document.createElement("div"); box.id = "say-box"; box.className = "say-box"; document.body.appendChild(box); }
  box.innerHTML = `<p>Tenhle prohlížeč neumí číst nahlas. Otevři výslovnost v Google Překladači a klepni tam na reproduktor.</p>
    <div class="actions"><a class="primary" href="${url}" target="_blank" rel="noopener">Otevřít výslovnost</a><button class="ghost" type="button" data-close-say>Zavřít</button></div>
    <p class="hint">Tip: v Chrome nebo Safari mimo aplikaci Claude funguje čtení přímo tady.</p>`;
  box.hidden = false;
  box.querySelector("[data-close-say]").onclick = () => { box.hidden = true; };
}
function say(t){
  if (!canSay) { sayFallback(t); return; }
  try {
    const synth = window.speechSynthesis;
    if (synth.speaking || synth.pending) synth.cancel(); // na iPhonu cancel před každým čtením řeč zahodí
    if (synth.paused) synth.resume();
    const u = new SpeechSynthesisUtterance(t.replace(/_{3}/g, "…"));
    if (!voice) pickVoice();
    u.lang = voice ? voice.lang : "en-GB";
    if (voice) u.voice = voice;
    u.rate = 0.85;
    // náhradní cestu nabídneme jen při skutečné chybě, ne při přerušení
    u.onerror = e => { if (["not-allowed", "synthesis-unavailable", "synthesis-failed", "language-unavailable", "voice-unavailable"].includes(e && e.error)) sayFallback(t); };
    synth.speak(u);
  } catch(e) { sayFallback(t); }
}
const SPK = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const sayBtn = t => `<button class="say" data-act="say" data-t="${esc(t)}" aria-label="Přehrát výslovnost" title="Přehrát">${SPK}</button>`;
const enSay = s => enHTML(s) + sayBtn(s);

const CONTR = {"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","that's":"that is","what's":"what is","there's":"there is","who's":"who is","let's":"let us","i'll":"i will","we'll":"we will","i've":"i have","don't":"do not","doesn't":"does not","didn't":"did not","can't":"cannot","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","haven't":"have not","hasn't":"has not","couldn't":"could not","mustn't":"must not","needn't":"need not","dont":"do not","doesnt":"does not","didnt":"did not","cant":"cannot","wont":"will not","isnt":"is not","arent":"are not","wasnt":"was not","werent":"were not","havent":"have not","hasnt":"has not","couldnt":"could not","mustnt":"must not","neednt":"need not","im":"i am","youre":"you are","theyre":"they are"};
function norm(s){
  return s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"„“…]/g, " ").replace(/-/g, " ").replace(/\bcan not\b/g, "cannot")
    .split(/\s+/).filter(Boolean).map(w => CONTR[w] || w).join(" ");
}

function openTopicPage(ti, si){
  T = { ti, si, theoryOpen: false };

}
function openReview(){
  T = { review: true };

}
const topicItems = (ti, si) => si === "all" ? TOPICS[ti].subs.flatMap(s => s.items) : TOPICS[ti].subs[+si].items;
const reviewItems = () => Object.keys(MIST).map(k => ITEM[k]).filter(Boolean);
function startSet(items, retry){
  const inM = it => keyOf(it) in MIST ? 1 : 0;
  const list = shuffle(items).sort((a, b) => inM(b) - inM(a)); // dřívější chyby jdou dopředu
  Q = { list, i: 0, score: 0, answered: false, chosen: null, typed: "", showTr: false, wrong: [], done: false, retry: !!retry };
  if (list.length) nextOpts();
}
function nextOpts(){ const it = Q.list[Q.i]; Q.opts = shuffle([it.a, ...shuffle(it.w).slice(0, 2)]); Q.answered = false; Q.chosen = null; Q.typed = ""; Q.showTr = false; }

      .map(([k, l]) => `<button class="chip${String(T.si) === k && !Q.retry ? " on" : ""}" data-act="chip" data-s="${k}">${l}</button>`).join("");

    fb = `<div class="fb ${right ? "ok" : "bad"}" role="status"><strong>${right ? "Správně!" : "Tohle není správně."}</strong>

      <p class="why"><b>Proč:</b> ${esc(it.why)}</p>${mnote}</div>

  const label = (T.review ? esc(TCZ[it.tid]) + " · " : "") + esc(it.part) + " · " + (isGap ? "Doplň do věty" : esc(KIND[it.part] || (isEN ? "Vyber správnou odpověď" : "Přelož do angličtiny")));

function resultHTML(){
  const n = Q.list.length, s = Q.score, pct = s / n;
  const msg = pct === 1 ? "Bez jediné chyby. Výborně!" : pct >= .8 ? "Skvělá práce. Zopakuj si pár drobností níže." : pct >= .5 ? "Dobrý základ. Projdi si chyby a zkus je znovu." : "Nevadí, chybami se člověk učí. Otevři si teorii a zkus to znovu.";
  const left = Object.keys(MIST).filter(k => ITEM[k]).length;
  return `<div class="card"><div class="kind">Výsledek</div><div class="score">${s}<small> / ${n}</small></div><p style="margin:0">${msg}</p>
  ${T.review ? `<p class="hint" style="margin:0">V „Moje chyby“ zbývá ${left}.</p>` : ""}
  <div class="actions">${Q.wrong.length ? `<button class="primary" data-act="retry">Opakovat chyby (${Q.wrong.length})</button>` : ""}

  ${Q.wrong.length ? `<div class="label">Co si zopakovat</div><ul class="miss">${Q.wrong.map(w => `<li>
    <span>${w.cz ? esc(w.main.replace("___", "…")) : esc(w.main)}</span>
    <span class="y">${esc(w.yours)}</span><span class="c">${enSay(w.a)}</span><span class="hint">${esc(w.why)}</span></li>`).join("")}</ul>` : ""}`;

function record(it, ok){
  const k = keyOf(it);
  if (!ok) MIST[k] = 0;
  else if (k in MIST) { MIST[k]++; if (MIST[k] >= 3) delete MIST[k]; }
  saveMist();
}
function answer(chosen, typed){
  if (!Q || Q.answered || Q.done) return;
  const it = Q.list[Q.i];
  const ok = typed != null ? norm(typed) === norm(it.a) : chosen === it.a;
  Q.chosen = ok ? it.a : (typed != null ? (typed.trim() || "(nevím)") : chosen);
  Q.typed = typed || ""; Q.answered = true;
  if (ok) Q.score++; else Q.wrong.push({...it, yours: Q.chosen});
  record(it, ok);
  render();
}
function next(){
  if (Q.i + 1 < Q.list.length) { Q.i++; nextOpts(); render(); return; }
  Q.done = true;
  if (!Q.retry && !T.review) {
    const t = TOPICS[T.ti], subs = T.si === "all" ? t.subs : [t.subs[+T.si]];
    subs.forEach(sb => { const got = sb.items.length - Q.wrong.filter(w => w.part === sb.name).length; if (best[sb.key] == null || got > best[sb.key]) best[sb.key] = got; });
    saveBest();
  }
  render(); (document.querySelector(".status") || document.querySelector(".card"))?.scrollIntoView({block: "start"});
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "home") { renderHome(); window.scrollTo({top: 0}); }
  else if (a === "doinstall") { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; view === "home" ? renderHome() : render(); }); } }
  else if (a === "install") { showInstall = !showInstall; view === "home" ? renderHome() : render(); window.scrollTo({top: 0}); }
  else if (a === "toggle") { openTopic = openTopic === b.dataset.id ? null : b.dataset.id; renderHome(); }
  else if (a === "open") openTopicPage(+b.dataset.t, b.dataset.s);
  else if (a === "review") openReview();
  else if (a === "chip") { T.si = b.dataset.s; startSet(topicItems(T.ti, T.si)); render(); }
  else if (a === "mode") { MODE = b.dataset.m; try { localStorage.setItem("ek2-mode", MODE); } catch(e) {} render(); }
  else if (a === "say") say(b.dataset.t);
  else if (a === "pick") answer(Q.opts[+b.dataset.k], null);
  else if (a === "dunno") answer(null, "");
  else if (a === "closeth") { T.theoryOpen = false; const d = document.getElementById("theory"); d.open = false; d.scrollIntoView({block: "nearest"}); }
  else if (a === "tr") { if (MODE === "type" && !Q.answered) Q.typed = document.getElementById("ans")?.value || ""; Q.showTr = !Q.showTr; render(); }
  else if (a === "next") next();
  else if (a === "again") { startSet(T.review ? reviewItems() : topicItems(T.ti, T.si)); render(); }
  else if (a === "retry") { startSet(Q.wrong.map(({yours, ...r}) => r), true); render(); }
});
document.addEventListener("keydown", e => {
  if (view !== "topic" || !Q || Q.done || !Q.list.length) return;
  if (e.target.closest && e.target.closest("summary, input")) return;
  if (!Q.answered && MODE === "click" && ["1","2","3"].includes(e.key)) answer(Q.opts[+e.key - 1], null);
  else if (Q.answered && e.key === "Enter") { e.preventDefault(); next(); }
});
renderHome();
</script>

<script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
